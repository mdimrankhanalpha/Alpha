<style>
/* ============================================
   Alpha — profile feed
   Black / white / grey. No decoration for its own sake.
   ============================================ */

:root{
  --bg: #050505;
  --bg-elevated: #0c0c0c;
  --border: rgba(255,255,255,0.08);
  --divider: rgba(255,255,255,0.28);
  --text: #f2f2f2;
  --text-dim: #8a8a8a;
  --text-faint: #555;
  --radius: 14px;
  --max-width: 620px;
}

*{ box-sizing: border-box; }

html, body{
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  width: 100%;
}

body{
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

#profile{
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 48px 16px 40px;
}

/* ---------- profile head ---------- */

#profile-head{
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-bottom: 36px;
}

.avatar-wrap{
  width: 104px;
  height: 104px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
}

#avatar{
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

#profile-name{
  margin: 14px 0 0;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.2px;
  color: var(--text);
}

#profile-bio{
  margin: 4px 0 0;
  font-size: 14px;
  color: var(--text-dim);
  font-weight: 400;
}

/* ---------- feed ---------- */

#feed{
  display: flex;
  flex-direction: column;
  gap: 26px;
}

.post{
  border-bottom: 4px solid var(--divider);
  padding-bottom: 26px;
  content-visibility: auto;
  contain-intrinsic-size: 1px 400px;
}

.post:last-child{
  border-bottom: none;
}

.post-text{
  font-size: 15px;
  color: var(--text);
  white-space: pre-line;
  word-wrap: break-word;
  margin: 0 0 10px;
}

.post-text:last-child{
  margin-bottom: 0;
}

/* ---------- single image ---------- */

.post-image-single{
  width: 100%;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
}

.post-image-single img{
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
}

/* ---------- gallery (multi-photo horizontal scroll) ---------- */

.gallery{
  position: relative;
}

.gallery-track{
  display: flex;
  gap: 8px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  border-radius: var(--radius);
}

.gallery-track::-webkit-scrollbar{
  display: none;
}

.gallery-item{
  flex: 0 0 auto;
  scroll-snap-align: center;
  max-width: 100%;
  max-height: 70vh;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  display: flex;
}

.gallery-item img{
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 70vh;
}

.gallery-meta{
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-faint);
}

.gallery-progress{
  flex: 1;
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.gallery-progress-bar{
  height: 100%;
  width: 0%;
  background: var(--text-dim);
  transition: width 0.15s ease-out;
}

.gallery-count{
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* ---------- audio ---------- */

.audio-list{
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.audio-item{
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
}

.audio-label{
  display: block;
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 8px;
  font-variant-numeric: tabular-nums;
}

.audio-item audio{
  display: block;
  width: 100%;
  height: 40px;
  color-scheme: dark;
}

.audio-error{
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-faint);
}

.audio-error a{
  color: var(--text-dim);
  text-decoration: underline;
}

/* ---------- video ---------- */

.video-list{
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.post-video{
  width: 100%;
  border-radius: var(--radius);
  overflow: hidden;
  background: #000;
  border: 1px solid var(--border);
}

.post-video video{
  display: block;
  width: 100%;
  height: auto;
  max-height: 80vh;
  background: #000;
  color-scheme: dark;
}

.post-video .audio-error{
  padding: 0 12px 10px;
}

/* ---------- broken image placeholder ---------- */

.img-broken{
  width: 100%;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-faint);
  font-size: 11px;
  background: var(--bg-elevated);
}

/* ---------- stopwatch ---------- */

#stopwatch-wrap{
  margin-top: 44px;
  display: flex;
  justify-content: center;
}

#stopwatch{
  font-size: 12px;
  letter-spacing: 0.5px;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

/* ---------- responsive ---------- */

@media (max-width: 430px){
  #profile{
    padding: 36px 12px 32px;
  }
  .avatar-wrap{
    width: 92px;
    height: 92px;
  }
}

@media (min-width: 768px){
  #profile{
    padding: 64px 16px 56px;
  }
}
</style>
</head>

  /* ------------------------------------------------------------
     2. FEED RENDERING
     Posts are built with a document fragment and images use
     native lazy loading, so nothing off-screen is fully decoded
     until it nears the viewport. This scales to thousands of posts.
  ------------------------------------------------------------ */

  var feedEl = document.getElementById("feed");
  var frag = document.createDocumentFragment();

  POSTS.forEach(function (post, index) {
    var postEl = document.createElement("article");
    postEl.className = "post";

    if (post.text) {
      var p = document.createElement("p");
      p.className = "post-text";
      p.textContent = post.text;
      postEl.appendChild(p);
    }

    if (post.images && post.images.length === 1) {
      postEl.appendChild(buildSingleImage(post.images[0], index));
    } else if (post.images && post.images.length > 1) {
      postEl.appendChild(buildGallery(post.images, index));
    }

    if (post.video && post.video.length) {
      postEl.appendChild(buildVideoList(post.video));
    }

    if (post.audio && post.audio.length) {
      postEl.appendChild(buildAudioList(post.audio));
    }

    frag.appendChild(postEl);
  });

  feedEl.appendChild(frag);

  /* ---------- single image ---------- */

  function buildSingleImage(url, postIndex) {
    var wrap = document.createElement("div");
    wrap.className = "post-image-single";

    var img = document.createElement("img");
    img.src = toRaw(url);
    img.alt = "Photo";
    img.loading = postIndex < 3 ? "eager" : "lazy";
    img.decoding = "async";
    attachFailSafe(img, wrap);

    wrap.appendChild(img);
    return wrap;
  }

  /* ---------- multi-photo horizontal gallery ---------- */

  function buildGallery(urls, postIndex) {
    var gallery = document.createElement("div");
    gallery.className = "gallery";

    var track = document.createElement("div");
    track.className = "gallery-track";
    track.tabIndex = 0;
    track.setAttribute("role", "region");
    track.setAttribute("aria-label", "Photo gallery, " + urls.length + " photos");

    var itemEls = [];

    urls.forEach(function (url, i) {
      var item = document.createElement("div");
      item.className = "gallery-item";

      var img = document.createElement("img");
      img.src = toRaw(url);
      img.alt = "Photo " + (i + 1) + " of " + urls.length;
      img.loading = postIndex < 3 && i === 0 ? "eager" : "lazy";
      img.decoding = "async";
      attachFailSafe(img, item);

      item.appendChild(img);
      track.appendChild(item);
      itemEls.push(item);
    });

    var meta = document.createElement("div");
    meta.className = "gallery-meta";

    var progress = document.createElement("div");
    progress.className = "gallery-progress";
    var progressBar = document.createElement("div");
    progressBar.className = "gallery-progress-bar";
    progress.appendChild(progressBar);

    var count = document.createElement("span");
    count.className = "gallery-count";

    function updateIndicator() {
      var idx = nearestItemIndex(track, itemEls);
      var total = itemEls.length;
      var left = total - (idx + 1);
      count.textContent =
        (idx + 1) + " / " + total + (left > 0 ? " \u00b7 " + left + " left" : " \u00b7 end");
      progressBar.style.width = (((idx + 1) / total) * 100) + "%";
    }

    var ticking = false;
    track.addEventListener(
      "scroll",
      function () {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () {
          updateIndicator();
          ticking = false;
        });
      },
      { passive: true }
    );

    updateIndicator();

    meta.appendChild(count);
    meta.appendChild(progress);

    gallery.appendChild(track);
    gallery.appendChild(meta);
    return gallery;
  }

  function nearestItemIndex(track, itemEls) {
    var trackCenter = track.scrollLeft + track.clientWidth / 2;
    var nearest = 0;
    var nearestDist = Infinity;
    itemEls.forEach(function (item, i) {
      var itemCenter = item.offsetLeft + item.clientWidth / 2;
      var dist = Math.abs(itemCenter - trackCenter);
      if (dist < nearestDist) {
        nearestDist = dist;
        nearest = i;
      }
    });
    return nearest;
  }

  /* ---------- audio + video ---------- */

  // Only one media element plays at a time: starting one pauses the rest.
  var currentlyPlaying = null;

  function registerExclusivePlayback(el) {
    el.addEventListener("play", function () {
      if (currentlyPlaying && currentlyPlaying !== el) {
        currentlyPlaying.pause();
      }
      currentlyPlaying = el;
    });
    el.addEventListener("ended", function () {
      if (currentlyPlaying === el) currentlyPlaying = null;
    });
  }

  // Human-readable label from a file URL, e.g. "New recording 18 sept 2026 9-00pm"
  function labelFromUrl(url, fallback) {
    try {
      var last = url.split("?")[0].split("/").pop();
      var name = decodeURIComponent(last).replace(/\.[^.]+$/, "");
      return name || fallback;
    } catch (e) {
      return fallback;
    }
  }

  function showMediaError(container, rawUrl, kind) {
    if (container.querySelector(".audio-error")) return;
    var msg = document.createElement("div");
    msg.className = "audio-error";
    msg.appendChild(document.createTextNode(kind + " could not be loaded. "));
    var link = document.createElement("a");
    link.href = rawUrl;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "Open file directly";
    msg.appendChild(link);
    container.appendChild(msg);
  }

  function buildAudioList(urls) {
    var list = document.createElement("div");
    list.className = "audio-list";

    urls.forEach(function (url, i) {
      var raw = toRaw(url);

      var item = document.createElement("div");
      item.className = "audio-item";

      var label = document.createElement("span");
      label.className = "audio-label";
      label.textContent =
        urls.length > 1
          ? "Audio " + (i + 1) + " of " + urls.length + " \u00b7 " + labelFromUrl(url, "Recording")
          : labelFromUrl(url, "Recording");

      var audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "metadata";
      audio.setAttribute("controlslist", "nodownload noplaybackrate");
      audio.setAttribute("playsinline", "");

      // Explicit <source> with a MIME type helps browsers pick a decoder for .m4a
      var source = document.createElement("source");
      source.src = raw;
      source.type = mimeForAudio(raw);
      audio.appendChild(source);

      audio.addEventListener("error", function () {
        showMediaError(item, raw, "Audio");
      }, true);
      source.addEventListener("error", function () {
        showMediaError(item, raw, "Audio");
      });

      registerExclusivePlayback(audio);

      item.appendChild(label);
      item.appendChild(audio);
      list.appendChild(item);
    });

    return list;
  }

  function buildVideoList(urls) {
    var list = document.createElement("div");
    list.className = "video-list";

    urls.forEach(function (url) {
      var raw = toRaw(url);

      var wrap = document.createElement("div");
      wrap.className = "post-video";

      var video = document.createElement("video");
      video.controls = true;
      video.preload = "metadata";
      video.setAttribute("playsinline", "");
      video.setAttribute("controlslist", "nodownload");

      var source = document.createElement("source");
      source.src = raw;
      source.type = "video/mp4";
      video.appendChild(source);

      source.addEventListener("error", function () {
        showMediaError(wrap, raw, "Video");
      });

      registerExclusivePlayback(video);

      wrap.appendChild(video);
      list.appendChild(wrap);
    });

    return list;
  }

  function mimeForAudio(url) {
    var ext = url.split("?")[0].split(".").pop().toLowerCase();
    var map = {
      m4a: "audio/mp4",
      mp4: "audio/mp4",
      aac: "audio/aac",
      mp3: "audio/mpeg",
      wav: "audio/wav",
      ogg: "audio/ogg",
      oga: "audio/ogg",
      opus: "audio/ogg",
      webm: "audio/webm",
      flac: "audio/flac"
    };
    return map[ext] || "";
  }

  /* ---------- broken-image safety net ---------- */

  function attachFailSafe(img, container) {
    img.addEventListener("error", function () {
      if (container.querySelector(".img-broken")) return;
      img.remove();
      var placeholder = document.createElement("div");
      placeholder.className = "img-broken";
      placeholder.textContent = "Image unavailable";
      container.appendChild(placeholder);
    });
  }

  /* ------------------------------------------------------------
     3. PROFILE AVATAR
  ------------------------------------------------------------ */
  var avatar = document.getElementById("avatar");
  avatar.src = toRaw(PROFILE_IMAGE);
  attachFailSafe(avatar, avatar.parentElement);

  /* ------------------------------------------------------------
     4. STOPWATCH
     Fixed start: 14 September 2026, 00:00:00 Bangladesh time (UTC+06:00).
     Elapsed time is always derived from (now - start), never stored,
     so it survives refreshes and cannot drift or reset.
  ------------------------------------------------------------ */
  var START_MS = Date.UTC(2026, 8, 13, 18, 0, 0); // 2026-09-14T00:00:00+06:00

  var stopwatchEl = document.getElementById("stopwatch");

  function pad(n) {
    return String(n).length < 2 ? "0" + n : String(n);
  }

  function tickStopwatch() {
    var elapsed = Date.now() - START_MS;
    if (elapsed < 0) elapsed = 0;

    var totalSeconds = Math.floor(elapsed / 1000);
    var days = Math.floor(totalSeconds / 86400);
    var hours = Math.floor((totalSeconds % 86400) / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;

    stopwatchEl.textContent =
      pad(days) + "d " + pad(hours) + "h " + pad(minutes) + "m " + pad(seconds) + "s";
  }

  tickStopwatch();
  setInterval(tickStopwatch, 1000);
})();
</script>
